title: { ko: "Aetheria Online — IOCP MMORPG 서버", en: "Aetheria Online — an IOCP MMORPG server" }
summary:
  {
    ko: "IOCP 비동기 서버에 NPC AI(Lua), A* 길찾기, 타이머, MSSQL 영속화를 통합한 미니 MMORPG. 단일 머신에서 설계 상한 10,000 동접을 채우고 이동 왕복 지연 약 20ms를 기록했다(localhost 측정).",
