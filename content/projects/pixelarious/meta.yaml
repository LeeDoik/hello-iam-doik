title: { ko: "PIXELARIOUS", en: "PIXELARIOUS" }
summary:
  {
    ko: "직접 만든 Godot 게임을 브라우저에서 바로 플레이하는 1인 픽셀 아케이드. 게임 추가는 JSON 레코드 하나이고, 내장 편집기에서 커밋·푸시·배포까지 한 번에 끝난다.",
    en: "A one-person pixel arcade for my own Godot games. Adding a game is one JSON record, and the built-in editor commits, pushes and deploys in one click.",
  }
